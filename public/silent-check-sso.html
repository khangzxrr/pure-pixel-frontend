<html>
  <body>
    <script>
      // Mimics oidc-client-ts's IFrameWindow.notifyParent(), which is what
      // UserManager.signinSilentCallback() posts from within the silent iframe.

        { source: "oidc-client", url: location.href, keepOpen: false },
        location.origin,
      );
    </script>
